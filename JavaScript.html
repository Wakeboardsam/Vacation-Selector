<script>
const appState = {
  currentUserName: null,
  publicData: null,
  dashboardData: null,
  activeFilter: 'all',
  highlightName: '',
  // Selection state
  pendingWeek1: null,
  pendingWeek2: null,
  sheetMode: null // 'primary' or 'secondary'
};

const appFunctions = {

  login: function() {
    const name = document.getElementById('login-name').value;
    const pin = document.getElementById('login-pin').value;
    const btn = document.getElementById('login-btn');

    if (!name || !pin) return;

    btn.disabled = true;
    btn.textContent = 'Checking...';

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.textContent = 'Log In';
        if (res.status === 'Success') {
          appState.currentUserName = name;
          appState.sessionToken = res.token;

          document.getElementById('login-pin').value = '';
          this.renderAuthNav();
          this.showRulesGateway(); // Always show rules gateway upon valid login per requirements
        } else {
          this.showToast(res.status || 'Invalid PIN.', true);
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        btn.textContent = 'Log In';
        this.showToast('Error: ' + err.message, true);
      })
      .verifyUser(name, pin);
  },

  showRulesGateway: function() {
    document.getElementById('login-card').classList.add('hidden');
    document.getElementById('rules-gateway').classList.remove('hidden');
    // Fetch rules content
    google.script.run.withSuccessHandler((res) => {
        const rulesList = document.getElementById('rules-list');
        if (rulesList && res.rules) {
            rulesList.innerHTML = '';
            res.rules.forEach(r => {
                const li = document.createElement('li');
                li.textContent = r;
                rulesList.appendChild(li);
            });
        }
    }).getRulesAndTips();
  },

  init: function() {
    this.fetchPublicData();
    this.fetchParticipantNames();

    // Set up modal listeners
    const backdrop = document.getElementById('bottom-sheet');
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) this.closeSheet();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && backdrop.classList.contains('visible')) {
        this.closeSheet();
      }
    });

    // Close theme menu on outside click or Escape
    document.addEventListener('click', (e) => {
      const popover = document.getElementById('theme-menu-popover');
      const toggleBtn = document.getElementById('theme-mobile-toggle');
      if (popover && popover.classList.contains('visible')) {
        if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
          this.closeThemeMenu();
        }
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const popover = document.getElementById('theme-menu-popover');
        if (popover && popover.classList.contains('visible')) {
          this.closeThemeMenu();
        }
      }
    });

    // Initialize UI state for Theme Selector
    this.updateThemeUI();

    // Toggle logic for Login vs Public
    document.getElementById('nav-toggle').addEventListener('click', () => {
      if (appState.currentUserName) {
        // Log out
        appState.currentUserName = null;
        appState.dashboardData = null;
        this.resetSelection();
        this.renderAuthNav();
        this.showLogin();
      } else {
        // Toggle view
        const loginCard = document.getElementById('login-card');
        if (loginCard.classList.contains('hidden')) {
          this.showLogin();
        } else {
          this.showPublicStatus();
        }
      }
    });
  },

  // ---------------------------------------------------------
  // Data Fetching
  // ---------------------------------------------------------
  fetchPublicData: function() {
    google.script.run
      .withSuccessHandler((data) => {
        appState.publicData = data;
        this.renderStatus();
        this.renderCalendar();
      })
      .withFailureHandler((err) => {
        this.showToast("Error loading calendar: " + err.message, true);
      })
      .getPublicCalendarData();
  },

  fetchParticipantNames: function() {
    google.script.run
      .withSuccessHandler((names) => {
        const loginSelect = document.getElementById('login-name');
        const hlSelect = document.getElementById('highlighter-select');

        // Keep first option
        loginSelect.options.length = 1;
        hlSelect.options.length = 1;

        if (Array.isArray(names)) {
          names.sort().forEach(n => {
            loginSelect.add(new Option(n, n));
            hlSelect.add(new Option(n, n));
          });
        } else {
          console.error("fetchParticipantNames did not return an array", names);
        }
      })
      .getParticipantNames();
  },

  fetchDashboardData: function() {
    if (!appState.currentUserName) return;
    google.script.run
      .withSuccessHandler((data) => {
        appState.dashboardData = data;
        this.renderDashboard();
      })
      .withFailureHandler((err) => {
        this.showToast("Error loading dashboard: " + err.message, true);
      })
      .getDashboardData(appState.currentUserName);
  },

  // ---------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------
  renderStatus: function() {
    const data = appState.publicData;
    if (!data) return;

    const content = document.getElementById('status-content');
    content.innerHTML = '';

    let allFull = true;
    data.calendarData.forEach(w => {
       if (w.spotsRemaining > 0) allFull = false;
    });

    if (allFull || data.calendarData.length === 0) {
      const p = document.createElement('p');
      p.className = 'text-bold';
      p.textContent = "Selection Complete: All available vacation slots have been filled.";
      content.appendChild(p);
      return;
    }

    const activeUsers = data.turnQueue.filter(p => (p.status === 'Active'));

    // Find the max index in turnQueue of any Active, Standby, or Backup participant
    let maxActionableIndex = -1;
    data.turnQueue.forEach((p, index) => {
      if ((p.status === 'Active')) {
        maxActionableIndex = index;
      }
    });

    let nextUpUsers = [];
    if (maxActionableIndex !== -1) {
      nextUpUsers = data.turnQueue.filter((p, index) => p.status === 'Waiting' && index > maxActionableIndex).slice(0, 5);
    }

    const roundHeader = document.createElement('h3');
    roundHeader.textContent = `Round ${data.currentRound} Window`;
    content.appendChild(roundHeader);

    activeUsers.forEach(p => {
      const item = document.createElement('div');
      item.className = 'status-item';

      const icon = document.createElement('span');
      icon.className = 'status-icon';
      icon.textContent = p.status === 'Active' ? '🟢' : '🟡';

      const details = document.createElement('div');
      details.className = 'status-details';

      const nameEl = document.createElement('span');
      nameEl.className = 'text-bold';
      nameEl.textContent = p.name;

      const posEl = document.createElement('span');
      posEl.className = 'text-small';
      posEl.textContent = `${p.status} (#${p.queuePosition})`;

      details.appendChild(nameEl);
      details.appendChild(posEl);

      item.appendChild(icon);
      item.appendChild(details);
      content.appendChild(item);
    });

    const nextHeader = document.createElement('h3');
    nextHeader.style.marginTop = '1rem';
    nextHeader.textContent = "Next Up";
    content.appendChild(nextHeader);

    if (nextUpUsers.length > 0) {
      const nextList = document.createElement('div');
      nextUpUsers.forEach(p => {
        const d = document.createElement('div');
        d.className = 'text-small';
        d.style.marginBottom = '0.25rem';
        d.textContent = `${p.name} (#${p.queuePosition})`;
        nextList.appendChild(d);
      });
      content.appendChild(nextList);
    } else {
      const endOfRound = document.createElement('div');
      endOfRound.className = 'text-small';
      endOfRound.style.marginBottom = '0.25rem';
      endOfRound.textContent = 'End of current round';
      content.appendChild(endOfRound);
    }
  },

  renderCalendar: function() {
    const data = appState.publicData;
    if (!data) return;

    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    // Apply Filters
    let weeks = data.calendarData;
    if (appState.activeFilter === 'available') {
      weeks = weeks.filter(w => w.spotsRemaining > 0);
    } else if (appState.activeFilter === 'prime') {
      weeks = weeks.filter(w => w.classification === 'Prime');
    } else if (appState.activeFilter === 'limited') {
      weeks = weeks.filter(w => w.spotsRemaining === 1);
    } else if (appState.activeFilter === 'full') {
      weeks = weeks.filter(w => w.spotsRemaining === 0);
    }

    if (weeks.length === 0) {
      grid.innerHTML = '<p>No weeks match the current filter.</p>';
      return;
    }

    weeks.forEach(w => {
      const card = document.createElement('div');
      card.className = 'week-card';

      const header = document.createElement('div');
      header.className = 'week-header';

      const dateEl = document.createElement('h3');
      dateEl.className = 'week-date';
      dateEl.textContent = w.startDate;

      const badge = document.createElement('span');
      badge.className = 'badge';
      if (w.classification === 'Prime') {
        badge.classList.add('prime');
        badge.textContent = 'PRIME';
      } else {
        badge.classList.add('available'); // generic tint for non-prime
        badge.textContent = w.classification;
      }

      header.appendChild(dateEl);
      header.appendChild(badge);
      card.appendChild(header);

      const capacityRow = document.createElement('div');
      capacityRow.style.display = 'flex';
      capacityRow.style.justifyContent = 'space-between';
      capacityRow.style.alignItems = 'center';

      const spotsText = document.createElement('span');
      spotsText.className = 'text-small text-bold';

      if (w.spotsRemaining === 0) {
        spotsText.textContent = 'FULL';
        spotsText.style.color = 'var(--full-text)';
      } else {
        spotsText.textContent = `${w.spotsRemaining} spots left`;
        if (w.spotsRemaining === 1) spotsText.style.color = 'var(--limited-text)';
      }

      const dots = document.createElement('div');
      dots.className = 'spots-indicator';
      for (let i = 0; i < 4; i++) {
        const dot = document.createElement('div');
        dot.className = 'spot-dot';
        if (i < (4 - w.spotsRemaining)) dot.classList.add('filled');
        dots.appendChild(dot);
      }

      capacityRow.appendChild(spotsText);
      capacityRow.appendChild(dots);
      card.appendChild(capacityRow);

      const participants = [w.person1, w.person2, w.person3, w.person4].filter(p => p && String(p).trim() !== '');
      if (participants.length > 0) {
        const pList = document.createElement('div');
        pList.className = 'participant-list';

        participants.forEach((p, index) => {
          const span = document.createElement('span');
          span.textContent = p;
          if (appState.highlightName && p === appState.highlightName) {
            span.classList.add('highlight-name');
          }
          pList.appendChild(span);
          if (index < participants.length - 1) {
            pList.appendChild(document.createTextNode(' · '));
          }
        });
        card.appendChild(pList);
      }

      grid.appendChild(card);
    });
  },

  renderAuthNav: function() {
    const nav = document.getElementById('nav-toggle');
    if (appState.currentUserName) {
      nav.textContent = 'Log Out';
    } else {
      nav.textContent = 'Login';
    }
  },

  showLogin: function() {
    document.getElementById('status-card').classList.add('hidden');
    document.getElementById('dashboard-card').classList.add('hidden');
    document.getElementById('login-card').classList.remove('hidden');
    document.getElementById('login-pin').value = '';

    // Clear selections on view change just in case
    this.resetSelection();
  },

  showPublicStatus: function() {
    document.getElementById('login-card').classList.add('hidden');
    document.getElementById('dashboard-card').classList.add('hidden');
    document.getElementById('status-card').classList.remove('hidden');
  },

  showDashboard: function() {
    document.getElementById('login-card').classList.add('hidden');
    document.getElementById('status-card').classList.add('hidden');
    document.getElementById('dashboard-card').classList.remove('hidden');
  },


  // ---------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------
  renderDashboard: function() {
    const data = appState.dashboardData;
    if (!data) return;

    this.showDashboard();
    document.getElementById('dashboard-welcome').textContent = `Good ${this.getTimeOfDay()}, ${data.currentUser.name}`;

    const summary = document.getElementById('dashboard-summary');
    summary.innerHTML = '';

    const currentPhase = data.currentPhase || "SETUP";

    let isComplete = false;
    if (currentPhase.includes('VACATION')) {
        let allFull = true;
        if (data.availableWeeks && data.availableWeeks.length > 0) {
          data.availableWeeks.forEach(w => {
             if (w.spotsRemaining > 0) allFull = false;
          });
        }
        if (allFull || !data.availableWeeks || data.availableWeeks.length === 0) isComplete = true;
    } else if (currentPhase.includes('WEEKEND')) {
        isComplete = (!data.weekendData || data.weekendData.filter(w => !w.firstCall || !w.secondCall).length === 0);
    } else if (currentPhase.includes('HOLIDAY')) {
        isComplete = (!data.holidayData || data.holidayData.filter(h => !h.call1 || !h.call2).length === 0);
    }

    if (isComplete) {
      const p = document.createElement('p');
      p.className = 'text-bold';
      p.textContent = "Selection Complete: All available slots have been filled.";
      summary.appendChild(p);
      document.getElementById('selection-controls').classList.add('hidden');
      return;
    }

    // Queue pos
    const pos = document.createElement('p');
    if (data.currentUser.status === 'Active') {
      pos.className = 'text-bold';
      pos.style.color = 'var(--available-text)';
      pos.textContent = 'You can select now.';
    } else {
      pos.textContent = `You're #${data.currentUser.queuePosition || '?'} in line. (${data.currentUser.status})`;
    }
    summary.appendChild(pos);

    // Selected items
    const selected = document.createElement('div');
    selected.className = 'card';
    selected.style.padding = '1rem';
    selected.style.marginTop = '1rem';
    selected.style.boxShadow = 'none';
    selected.style.backgroundColor = 'var(--bg-color)';

    const selTitle = document.createElement('div');
    selTitle.className = 'text-bold';
    selTitle.style.marginBottom = '0.5rem';
    selTitle.textContent = `Your Assignments`;
    selected.appendChild(selTitle);

    // Vacation
    if (data.currentUser.selectedWeeks && data.currentUser.selectedWeeks.length > 0) {
      const titleV = document.createElement('div');
      titleV.textContent = 'Vacation: ' + data.currentUser.selectedWeeks.length + ' weeks';
      selected.appendChild(titleV);
    }
    // Weekend
    if (data.currentUser.weekendAssignments && data.currentUser.weekendAssignments.length > 0) {
      const titleWE = document.createElement('div');
      titleWE.textContent = 'Weekends: ' + data.currentUser.weekendAssignments.length;
      selected.appendChild(titleWE);
    }
    // Holiday
    if (data.currentUser.holidayAssignments && data.currentUser.holidayAssignments.length > 0) {
      const titleH = document.createElement('div');
      titleH.textContent = 'Holidays: ' + data.currentUser.holidayAssignments.length;
      selected.appendChild(titleH);
    }

    if (data.currentUser.skipNextTurn) {
      const skipMsg = document.createElement('div');
      skipMsg.style.color = 'var(--full-text)';
      skipMsg.style.marginTop = '0.5rem';
      skipMsg.className = 'text-bold text-small';
      skipMsg.textContent = 'Note: You chose two Non-Prime weeks last time. Your next regular turn will be skipped.';
      selected.appendChild(skipMsg);
    }

    summary.appendChild(selected);

    // Selection Controls
    const controls = document.getElementById('selection-controls');
    if (data.currentUser.status === 'Active') {
      controls.classList.remove('hidden');
      const rules = document.getElementById('selection-rules');
      if (rules) {
        rules.textContent = currentPhase.includes('VACATION') ? `Round ${data.currentRound || 1}: Select one Prime week, or up to two Non-Prime weeks.` : `Phase: ${currentPhase}. Please make a selection.`;
      }
      this.updateSelectionSummaryUI();
    } else {
      controls.classList.add('hidden');
    }
  },


  openPrimaryPicker: function() {
    const data = appState.dashboardData;
    if (!data) return;

    const phase = data.currentPhase || "SETUP";
    if (phase.includes('VACATION')) {
        this.openVacationPicker();
    } else if (phase.includes('WEEKEND')) {
        this.openWeekendPicker();
    } else if (phase.includes('HOLIDAY')) {
        this.openHolidayPicker(phase === 'HOLIDAY_VOLUNTEER');
    } else if (phase === 'TRANSFER_GIVER') {
        this.openTransferOffer();
    } else if (phase === 'TRANSFER_RECEIVER') {
        this.openTransferReceiver();
    }
  },

  openVacationPicker: function() {
      // Stub to route back to standard week selection modal logic
      const modal = document.getElementById('week-picker-modal');
      if (modal) modal.classList.remove('hidden');
  },

  openWeekendPicker: function() {
    const data = appState.dashboardData;
    const list = document.getElementById('weekend-picker-list');
    list.innerHTML = '';

    if (!data.weekendData || data.weekendData.length === 0) {
        list.innerHTML = '<p>No available weekends.</p>';
        document.getElementById('weekend-picker-modal').classList.remove('hidden');
        return;
    }

    data.weekendData.forEach(we => {
        if (!we.firstCall || !we.secondCall) {
            const div = document.createElement('div');
            div.className = 'week-item';
            div.innerHTML = '<strong>' + we.date + '</strong> - ' + we.dayOfWeek;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-outline';
            btn.textContent = 'Select ' + (we.firstCall ? 'Second Call' : 'First Call');
            btn.onclick = () => {
                this.pendingSelection = { type: 'WEEKEND', date: we.date, call: we.firstCall ? 'SecondCall' : 'FirstCall' };
                this.checkForHolidayPrompt(we.date);
            };
            div.appendChild(btn);
            list.appendChild(div);
        }
    });

    document.getElementById('weekend-picker-modal').classList.remove('hidden');
  },

  checkForHolidayPrompt: function(selectedDate) {
    const prompt = document.getElementById('weekend-holiday-prompt');
    prompt.classList.remove('hidden');
    document.getElementById('weekend-holiday-desc').textContent = 'Warning checks and Optional Holiday Prompts render here';
  },

  closeModal: function(id) {
     const el = document.getElementById(id);
     if (el) el.classList.add('hidden');
  },

  openHolidayPicker: function(canPass) {
     const modal = document.getElementById('holiday-picker-modal');
     const passBtn = document.getElementById('holiday-pass-btn');
     if (canPass) {
         passBtn.classList.remove('hidden');
     } else {
         passBtn.classList.add('hidden');
     }
     modal.classList.remove('hidden');
  },

  openTransferOffer: function() {
      document.getElementById('transfer-offer-modal').classList.remove('hidden');
  },

  openTransferReceiver: function() {
      document.getElementById('transfer-receiver-modal').classList.remove('hidden');
  },

  confirmWeekendSelection: function() {
      this.closeModal('weekend-picker-modal');
      // Submits payload via processSelection
      this.submitSelection();
  },

  confirmHolidaySelection: function() {
      this.closeModal('holiday-picker-modal');
      this.submitSelection();
  },

  updateSelectionSummaryUI: function() {
    const summaryContainer = document.getElementById('pending-selection-summary');
    const btn = document.getElementById('start-selection-btn');
    const list = document.getElementById('pending-weeks-list');
    const actionsContainer = document.getElementById('review-actions-container');

    if (!appState.pendingWeek1) {
      summaryContainer.classList.add('hidden');
      btn.classList.remove('hidden');
      if (document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
         btn.focus();
      }
      return;
    }

    btn.classList.add('hidden');
    summaryContainer.classList.remove('hidden');
    list.innerHTML = '';
    if(actionsContainer) actionsContainer.innerHTML = '';

    // Week 1
    const w1 = document.createElement('div');
    w1.textContent = `1. ${appState.pendingWeek1.displayDate} (${appState.pendingWeek1.classification})`;
    list.appendChild(w1);

    const isRound1 = appState.dashboardData.currentRound === 1;
    let confirmBtnText = "Confirm selection";

    if (appState.pendingWeek2) {
      // Two Non-Prime
      const w2 = document.createElement('div');
      w2.textContent = `2. ${appState.pendingWeek2.displayDate} (${appState.pendingWeek2.classification})`;
      list.appendChild(w2);

      const warn = document.createElement('div');
      warn.className = 'text-small';
      warn.style.color = 'var(--limited-text)';
      warn.style.marginTop = '0.5rem';
      warn.textContent = "⚠️ Submitting two weeks will forfeit your next scheduled turn.";
      list.appendChild(warn);

      confirmBtnText = "Confirm both";
    } else if (!isRound1 && appState.pendingWeek1.classification === 'Non-Prime') {
      // One Non-Prime (Round 2+)
      confirmBtnText = "Submit one week";

      const addSecondBtn = document.createElement('button');
      addSecondBtn.type = 'button';
      addSecondBtn.className = 'secondary';
      addSecondBtn.style.marginBottom = '0.5rem';
      addSecondBtn.textContent = "Add a second non-prime week";
      addSecondBtn.onclick = () => window.appFunctions.openSecondaryPicker();
      if(actionsContainer) actionsContainer.appendChild(addSecondBtn);
    }

    // Confirm button
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.id = 'submit-selection-btn';
    confirmBtn.className = 'secondary';
    confirmBtn.textContent = confirmBtnText;
    confirmBtn.onclick = () => window.appFunctions.submitSelection();
    if(actionsContainer) actionsContainer.insertBefore(confirmBtn, actionsContainer.firstChild);

    // Change/Cancel button
    const changeBtn = document.createElement('button');
    changeBtn.type = 'button';
    changeBtn.className = 'text-only';
    changeBtn.style.width = '100%';
    changeBtn.style.marginTop = '0.5rem';
    changeBtn.textContent = appState.pendingWeek2 ? "Change selections" : "Change week";
    changeBtn.onclick = () => window.appFunctions.resetSelection();
    if(actionsContainer) actionsContainer.appendChild(changeBtn);

    // Focus primary action
    if (document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        setTimeout(() => { if(confirmBtn) confirmBtn.focus(); }, 50);
    }
  },

  resetSelection: function() {
    appState.pendingWeek1 = null;
    appState.pendingWeek2 = null;
    this.updateSelectionSummaryUI();
  },



  submitSelection: function() {
    const btn = document.getElementById('start-selection-btn');
    btn.disabled = true;
    btn.textContent = "Submitting...";

    const currentPhase = (appState.dashboardData && appState.dashboardData.currentPhase) ? appState.dashboardData.currentPhase : 'VACATION';

    const payload = {
      name: appState.currentUserName,
      token: appState.sessionToken,
      phase: currentPhase,
      pendingSelection: this.pendingSelection || {}
    };

    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false;
        btn.textContent = "Choose your week";
        if (res.success) {
          this.showToast(res.message);
          this.pendingSelection = null;
          this.fetchDashboardData();
          this.fetchPublicData();
        } else {
          if (res.message && res.message.includes('Invalid session')) {
              appState.currentUserName = null;
              appState.sessionToken = null;
              this.showToast("Session expired. Please log in again.", true);
              this.showLogin();
          } else {
              this.showToast("Error: " + res.message, true);
          }
        }
      })
      .withFailureHandler((err) => {
        btn.disabled = false;
        btn.textContent = "Choose your week";
        this.showToast("System Error: " + err.message, true);
      })
      .processSelection(payload);
  },



  // ---------------------------------------------------------
  // Theme Methods
  // ---------------------------------------------------------
  setTheme: function(themeValue) {
    if (['boring', 'anesthesia', 'ketamine'].includes(themeValue)) {
      try {
        localStorage.setItem('vacationSelectorTheme', themeValue);
      } catch (e) {
        console.warn("Could not save theme to localStorage", e);
      }
      document.documentElement.setAttribute('data-theme', themeValue);
      this.updateThemeUI();
      this.closeThemeMenu();
    }
  },

  updateThemeUI: function() {
    let currentTheme = 'boring';
    try {
      currentTheme = localStorage.getItem('vacationSelectorTheme') || 'boring';
    } catch (e) {
      // ignore
    }

    // Update segmented control
    document.querySelectorAll('.theme-segment-btn').forEach(btn => {
      if (btn.getAttribute('data-theme-val') === currentTheme) {
        btn.classList.add('active');
        btn.setAttribute('aria-checked', 'true');
      } else {
        btn.classList.remove('active');
        btn.setAttribute('aria-checked', 'false');
      }
    });

    // Update mobile menu items
    document.querySelectorAll('.theme-menu-item').forEach(btn => {
      const isSelected = btn.getAttribute('data-theme-val') === currentTheme;
      if (isSelected) {
        btn.classList.add('active');
        btn.querySelector('span').textContent = '✓';
      } else {
        btn.classList.remove('active');
        btn.querySelector('span').textContent = '';
      }
    });
  },

  toggleThemeMenu: function() {
    const popover = document.getElementById('theme-menu-popover');
    const toggleBtn = document.getElementById('theme-mobile-toggle');
    if (popover.classList.contains('visible')) {
      this.closeThemeMenu();
    } else {
      popover.classList.add('visible');
      toggleBtn.setAttribute('aria-expanded', 'true');
    }
  },

  closeThemeMenu: function() {
    const popover = document.getElementById('theme-menu-popover');
    const toggleBtn = document.getElementById('theme-mobile-toggle');
    if (popover && popover.classList.contains('visible')) {
      popover.classList.remove('visible');
      toggleBtn.setAttribute('aria-expanded', 'false');
      toggleBtn.focus();
    }
  },

  // ---------------------------------------------------------
  // Utilities
  // ---------------------------------------------------------
  showToast: function(message, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    if (isError) toast.classList.add('error');

    // Icon
    const icon = document.createElement('span');
    icon.textContent = isError ? '❌' : '✅';
    toast.appendChild(icon);

    // Text
    const text = document.createElement('span');
    text.textContent = message;
    toast.appendChild(text);

    container.appendChild(toast);

    // Trigger reflow
    void toast.offsetWidth;
    toast.classList.add('show');

    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => {
        if (container.contains(toast)) container.removeChild(toast);
      }, 300);
    }, 4000);
  },

  getTimeOfDay: function() {
    const hour = new Date().getHours();
    if (hour < 12) return 'morning';
    if (hour < 17) return 'afternoon';
    return 'evening';
  }
};

// Expose strictly what is needed to HTML handlers
window.appFunctions = appFunctions;

// Init on load
document.addEventListener('DOMContentLoaded', () => {
  appFunctions.init();
});
</script>
